# Chay khong can SQL Server:  mvn spring-boot:run -Dspring-boot.run.profiles=h2
# Du lieu nam trong RAM, tat app la mat (moi lan chay lai se seed lai 16 phong mau).
spring.datasource.url=jdbc:h2:mem:SBA301_2026_HRB;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=sa
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true
