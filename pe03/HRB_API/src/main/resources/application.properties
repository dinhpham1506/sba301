spring.application.name=HRB_API
server.port=8080

# ===== SQL Server (giong de thi) =====
# Tao database truoc: CREATE DATABASE SBA301_2026_HRB;  (xem file database.sql)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=SBA301_2026_HRB;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Frontend origin cho CORS
app.cors.allowed-origin=http://localhost:5173
