spring.application.name=mtb-api
server.port=8080

# ===== SQL Server =====
# Database must exist first: CREATE DATABASE SBA301_2026_PE;  (see database.sql)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=SBA301_2026_PE;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

